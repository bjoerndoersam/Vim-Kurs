<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Normalmodus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktiver Vim-Kurs mit 30 Lektionen, Challenges, Zielscheiben-Training, Spielwiese und Spickzettel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: Kursnavigation links, Lektion rechts; der dunkle Editor ist das Werkstück jeder Seite. */
:root {
  --bg: #eff2f0; --surface: #ffffff; --surface-2: #f5f7f6; --line: #d6ddd9; --line-strong: #b9c4be;
  --ink: #111a16; --muted: #56645d; --accent: #0b7a4b; --accent-ink: #ffffff; --accent-soft: #ddefe5;
  --amber: #b97605; --violet: #6a4fd6; --danger: #c0412c; --danger-soft: #f8e2dd;
  --ed-bg: #15201b; --ed-bar: #1d2a24; --ed-curline: #1a2620; --ed-fg: #d8e3dd; --ed-dim: #5d7268; --ed-tilde: #3a4c43;
  --ed-sel: #2d4a68; --ed-hl: #5e4a12; --ed-hl-fg: #ffe9b0; --cursor: #f2b84b; --tgt: #46d697; --tgt-faint: rgba(70, 214, 151, .45);
  --ed-err: #ff8f7a; --ed-warn: #f2c66b; --m-normal: #46d697; --m-insert: #f2b84b; --m-visual: #a996ff; --m-replace: #ff8f7a; --m-cmd: #8fb3a3;
  --veil: rgba(10, 16, 13, .28);
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --top-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1210; --surface: #141b18; --surface-2: #18211d; --line: #26322c; --line-strong: #37463e;
    --ink: #e3ebe7; --muted: #92a199; --accent: #5cc796; --accent-ink: #04140c; --accent-soft: #163024;
    --amber: #f1b24a; --violet: #a996ff; --danger: #f07c66; --danger-soft: #3a1d17;
    --ed-bg: #090d0b; --ed-bar: #121a16; --ed-curline: #0f1612; --ed-fg: #d8e3dd; --ed-dim: #52665c; --ed-tilde: #2c3a33;
    --ed-sel: #284563; --ed-hl: #5a4610; --veil: rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1210; --surface: #141b18; --surface-2: #18211d; --line: #26322c; --line-strong: #37463e;
  --ink: #e3ebe7; --muted: #92a199; --accent: #5cc796; --accent-ink: #04140c; --accent-soft: #163024;
  --amber: #f1b24a; --violet: #a996ff; --danger: #f07c66; --danger-soft: #3a1d17;
  --ed-bg: #090d0b; --ed-bar: #121a16; --ed-curline: #0f1612; --ed-fg: #d8e3dd; --ed-dim: #52665c; --ed-tilde: #2c3a33;
  --ed-sel: #284563; --ed-hl: #5a4610; --veil: rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font: .9em var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; }
kbd { font: 600 .82em/1.5 var(--mono); padding: .08em .5em; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); color: var(--ink); white-space: nowrap; display: inline-block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons */
.btn { font: 600 14px/1.2 var(--body); padding: 10px 16px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: transform .08s ease, background .15s ease; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.small { padding: 7px 12px; font-size: 13px; }
.linkish { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkish:hover { color: var(--ink); }

/* Kopfzeile */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 20px; background: var(--bg); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 700 17px var(--mono); letter-spacing: -.02em; flex: none; }
.brand-cur { width: 13px; height: 22px; background: var(--amber); border-radius: 2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.topnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.topnav::-webkit-scrollbar { display: none; }
.topnav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14.5px; padding: 7px 11px; border-radius: 8px; white-space: nowrap; }
.topnav a:hover { color: var(--ink); background: var(--surface-2); }
.topnav a.now { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.menu-btn { display: none; flex: none; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; }
.menu-btn svg { display: block; margin: auto; }

/* Grundgerüst */
.shell { display: grid; grid-template-columns: 286px minmax(0, 1fr); }
.sidebar { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top-h)); overflow-y: auto; border-right: 1px solid var(--line); padding: 20px 14px 40px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.scrim { display: none; }
main { min-width: 0; padding-block: 34px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.page.start, .page.challenges, .page.cheatsheet, .page.playground { max-width: 1120px; }
.page > *, .practice, .pr-stage, .hero-copy, .hero-try, .l-head, .prose, .ch-card, .cs-ch, #ch-active, .pg-side, .chapters { min-width: 0; }
.practice, .pr-stage, .hero-copy, .hero-try, .l-head, .prose, .ch-card, .cs-ch, #ch-active, .pg-side, .chapters { grid-template-columns: minmax(0, 1fr); }

/* Seitenleiste */
.sb-progress { display: flex; align-items: center; gap: 14px; font-size: 14px; line-height: 1.4; padding: 4px 4px 0; }
.sb-ring { --p: 0; width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
.sb-ring span { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font: 700 12px var(--mono); }
.sb-ch-h { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 0 6px 6px; }
.sb-num { font: 700 11px var(--mono); width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.sb-ch ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.sb-l { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3; }
.sb-l:hover { background: var(--surface-2); }
.sb-l.now { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.sb-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-strong); display: inline-block; flex: none; }
.started .sb-dot { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.done .sb-dot { border-color: var(--accent); background: var(--accent); }
.sb-st { font: 12px var(--mono); color: var(--amber); letter-spacing: 1px; }
.sb-foot { margin-top: auto; padding: 14px 6px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: 13.5px; }
.confirm { display: flex; gap: 8px; }

/* Typografie der Seiten */
.eyebrow { font: 600 12.5px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.eyebrow .sep { color: var(--line-strong); margin: 0 4px; }
.l-head { display: grid; gap: 12px; }
.l-head h1 { font: 800 clamp(2.1rem, 4vw, 2.9rem)/1.05 var(--display); letter-spacing: -.025em; }
.lede { font-size: 1.14rem; color: var(--muted); max-width: 64ch; }
.prose { display: grid; gap: 14px; max-width: 68ch; font-size: 1.02rem; }
.prose b { font-weight: 600; }
.tip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tip b { font: 700 11.5px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-right: 8px; }
.demo-target { background: var(--tgt); color: var(--ed-bg); font-family: var(--mono); font-size: .88em; padding: 0 .3em; border-radius: 3px; }

.l-keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.keycard { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; min-width: 0; }
.keycard kbd { font-size: 14px; padding: .2em .6em; min-width: 2.2em; text-align: center; flex: none; }
.keycard span { font-size: 14px; line-height: 1.35; color: var(--muted); min-width: 0; }

/* Übungspanel */
.practice { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.pr-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.pr-steps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pr-heading { font: 600 12.5px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 8px; }
.step { width: 24px; height: 7px; border-radius: 4px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.step.done { background: var(--accent); }
.step.now { outline: 2px solid var(--ink); outline-offset: 2px; }
.pr-meter { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pr-meter b { color: var(--ink); }
.pr-keys.over b { color: var(--amber); }
.mini-stars { color: var(--amber); letter-spacing: 1px; }
.pr-task { font-size: 1.06rem; }
.pr-stage { display: grid; gap: 14px; min-width: 0; }
.has-goal .pr-stage { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
.pr-ed { min-width: 0; }
.pr-goal { border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--surface-2); padding: 10px 14px 12px; min-width: 0; }
.pr-goal.reached { border-style: solid; border-color: var(--accent); }
.pr-goal-h { display: flex; justify-content: space-between; gap: 8px; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.pr-goal-state { text-transform: none; letter-spacing: 0; font: 12px var(--mono); }
.pr-goal.reached .pr-goal-state { color: var(--accent); }
.pr-goal-text { font: 14px/1.65 var(--mono); white-space: pre; overflow-x: auto; margin: 0; }
.gl.ok { color: var(--accent); }
.gl.extra { color: var(--danger); font-family: var(--body); font-size: 13px; }
.pr-log { display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; align-items: center; }
.pr-log kbd { font-size: 12.5px; }
.log-empty { font-size: 13.5px; color: var(--muted); }
.pr-done { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; background: var(--accent-soft); border-radius: 11px; padding: 10px 14px; animation: rise .25s ease; }
@keyframes rise { from { transform: translateY(4px); opacity: .4; } }
.done-stars { font-size: 1.35rem; color: var(--amber); letter-spacing: 3px; line-height: 1; }
.done-hint { margin-left: auto; font-size: 13.5px; color: var(--muted); }
.pr-sol { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.sol-label { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sol-keys { display: flex; flex-wrap: wrap; gap: 4px; }
.pr-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.pr-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Editor */
.editor { position: relative; background: var(--ed-bg); color: var(--ed-fg); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 0 rgba(0, 0, 0, .04), 0 10px 30px -18px rgba(0, 0, 0, .5); }
.editor.focused { box-shadow: 0 0 0 2px var(--accent), 0 10px 30px -18px rgba(0, 0, 0, .5); }
.ed-screen { --rows: 8; font: 14.5px/1.7 var(--mono); padding: 10px 0; height: calc(var(--rows) * 1.7em + 20px); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.ed-line { display: flex; white-space: pre; height: 1.7em; min-width: max-content; }
.ed-line.curline { background: var(--ed-curline); }
.ed-gut { flex: none; text-align: right; padding: 0 1.4ch 0 .6ch; color: var(--ed-dim); user-select: none; box-sizing: content-box; font-variant-numeric: tabular-nums; }
.ed-gut.now { color: var(--cursor); }
.ed-gut.left { text-align: left; }
.ed-txt { padding-right: 3ch; }
.tilde .ed-txt { color: var(--ed-tilde); padding-left: 1ch; }
.cur { background: var(--cursor); color: var(--ed-bg); border-radius: 2px; }
.editor:not(.focused) .cur { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px var(--cursor); }
.cur-ins { box-shadow: inset 2px 0 0 var(--cursor); }
.cur-rep { box-shadow: inset 0 -3px 0 var(--cursor); }
.cur-dim { box-shadow: inset 0 0 0 1px var(--ed-dim); }
.sel { background: var(--ed-sel); }
.sel.cur { background: var(--cursor); }
.hl { background: var(--ed-hl); color: var(--ed-hl-fg); }
.tgt { background: var(--tgt); color: var(--ed-bg); border-radius: 3px; animation: pulse 1.3s ease-in-out infinite; }
.tgt-later { box-shadow: inset 0 0 0 1px var(--tgt-faint); border-radius: 3px; }
.tgt.cur, .tgt.cur-ins { background: var(--cursor); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--tgt-faint); } }
.ed-status { display: flex; align-items: center; gap: 12px; background: var(--ed-bar); font: 12px/1.4 var(--mono); padding: 6px 12px; color: var(--ed-fg); min-height: 30px; }
.ed-mode { padding: 2px 8px; border-radius: 4px; font-weight: 700; letter-spacing: .04em; background: var(--m-normal); color: var(--ed-bg); }
[data-mode="insert"] .ed-mode { background: var(--m-insert); }
[data-mode="replace"] .ed-mode { background: var(--m-replace); }
[data-mode="visual"] .ed-mode, [data-mode="vline"] .ed-mode, [data-mode="vblock"] .ed-mode { background: var(--m-visual); }
[data-mode="cmdline"] .ed-mode { background: var(--m-cmd); }
.ed-pending { color: var(--cursor); font-weight: 700; }
.ed-rec { color: var(--ed-err); font-weight: 700; }
.ed-rec::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.ed-pos { margin-left: auto; color: var(--ed-dim); font-variant-numeric: tabular-nums; }
.ed-cmd { font: 13.5px/1.5 var(--mono); padding: 5px 12px 7px; min-height: 2.2em; white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--ed-fg); }
.ed-cmd.error { color: var(--ed-err); }
.ed-cmd.warn { color: var(--ed-warn); }
.ed-cmd.mode { color: var(--ed-dim); font-weight: 700; }
.cmd-cur { background: var(--cursor); }
.ed-list { position: absolute; left: 0; right: 0; bottom: 64px; max-height: 70%; overflow: auto; margin: 0; padding: 10px 14px; background: var(--ed-bar); border-top: 1px solid var(--ed-tilde); font: 12.5px/1.55 var(--mono); color: var(--ed-fg); z-index: 3; pointer-events: none; }
.ed-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; resize: none; border: 0; padding: 0; margin: 0; font-size: 16px; cursor: text; z-index: 2; color: transparent; background: transparent; caret-color: transparent; }
.ed-overlay { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: flex-end; padding: 10px; pointer-events: none; background: var(--veil); transition: opacity .15s ease; z-index: 1; }
.ed-overlay span { background: var(--ed-bar); color: var(--ed-fg); border: 1px solid var(--ed-dim); padding: 5px 12px; border-radius: 999px; font: 500 13px var(--body); }
.editor.focused .ed-overlay { opacity: 0; }
.ed-toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--danger); color: #fff; font: 600 13px var(--body); padding: 6px 12px; border-radius: 8px; z-index: 4; white-space: nowrap; }
.ed-touch { display: none; position: absolute; right: 8px; top: 8px; gap: 6px; z-index: 4; }
.ed-touch button { font: 700 12px var(--mono); padding: 6px 10px; border-radius: 7px; border: 1px solid var(--ed-dim); background: var(--ed-bar); color: var(--ed-fg); }
.ed-touch button[aria-pressed="true"] { background: var(--cursor); color: var(--ed-bg); }
@media (pointer: coarse) { .ed-touch { display: flex; } .ed-overlay { justify-content: flex-start; } }

/* Lektionsende & Blättern */
.done-card { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 16px 18px; }
.done-card h2 { font: 800 1.3rem var(--display); }
.done-card p { color: var(--muted); font-size: 14.5px; }
.done-card > div { flex: 1 1 260px; min-width: 0; }
.done-card .done-stars { font-size: 1.7rem; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pg { display: grid; gap: 2px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.pg:hover { border-color: var(--line-strong); }
.pg small { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pg span { font-weight: 600; }
.pg.next { text-align: right; }

/* Start */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.hero-copy { display: grid; gap: 18px; }
.hero h1 { font: 800 clamp(2.4rem, 5vw, 3.7rem)/1.0 var(--display); letter-spacing: -.035em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 6px 0 0; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.stats dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.stats dd { margin: 0; font: 700 1.5rem var(--mono); font-variant-numeric: tabular-nums; }
.stats small { font-size: .55em; color: var(--muted); font-weight: 400; }
.hero-try { display: grid; gap: 8px; min-width: 0; }
.try-label { font: 600 12.5px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.hero-try .practice { padding: 14px; }
.chapters { display: grid; gap: 16px; }
.chapters > h2 { font: 800 1.6rem var(--display); letter-spacing: -.02em; }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ch-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.ch-top { display: flex; justify-content: space-between; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ch-count { font-family: var(--mono); letter-spacing: 0; }
.ch-card h3 { font: 800 1.3rem var(--display); letter-spacing: -.015em; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.ch-card ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ch-card li { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.ch-card li a { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; min-width: 0; }
.ch-card li a:hover { color: var(--accent); }
.ch-keys { display: flex; gap: 3px; flex: none; }
.ch-keys kbd { font-size: 11px; padding: 0 .4em; }
.ch-card.extra { background: var(--surface-2); }
.extra-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.extra-list a { display: grid; gap: 1px; text-decoration: none; color: var(--ink); padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.extra-list a:hover { border-color: var(--accent); }
.extra-list span { font-size: 13.5px; color: var(--muted); }

/* Challenges */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.cc { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.cc:hover { border-color: var(--line-strong); }
.cc.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cc-top { display: flex; justify-content: space-between; align-items: center; }
.cc-num { font: 700 12px var(--mono); color: var(--muted); }
.lvl { font-size: 10px; letter-spacing: 2px; color: var(--amber); }
.cc b { font: 800 1.08rem var(--display); }
.cc-task { font-size: 14px; color: var(--muted); line-height: 1.4; }
.cc-foot { display: flex; justify-content: space-between; font: 12.5px var(--mono); color: var(--muted); margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.cc.done .cc-foot span:last-child { color: var(--ink); }
#ch-active:empty { display: none; }
#ch-active { display: grid; gap: 10px; }
.ch-active-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ch-active-h h2 { font: 800 1.4rem var(--display); }

/* Zielscheibe */
.drill-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.db { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; display: grid; }
.db span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.db b { font: 700 1.6rem var(--mono); font-variant-numeric: tabular-nums; }
.drill-meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: -14px; }
.drill-meter span { display: block; height: 100%; width: 100%; background: var(--amber); transition: width .1s linear; }
.drill-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }

/* Spielwiese */
.pg-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
.pg-side { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.pg-side h3 { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.pg-side section { display: grid; gap: 4px; min-width: 0; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14.5px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.pg-table { display: grid; gap: 4px; font-size: 13.5px; min-width: 0; }
.pg-table > div { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.pg-table code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pg-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.pg-own { flex: 1 1 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.pg-own summary { cursor: pointer; font-weight: 600; }
.pg-own[open] { display: grid; gap: 8px; }
.pg-own textarea { width: 100%; font: 13.5px/1.5 var(--mono); border: 1px solid var(--line-strong); border-radius: 9px; padding: 10px; background: var(--surface-2); color: var(--ink); resize: vertical; }
.pg-own .btn { justify-self: start; }

/* Spickzettel */
.search input { width: 100%; max-width: 520px; font: 16px var(--body); padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.cs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.cs-ch { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.cs-ch h2 { font: 800 1.25rem var(--display); display: flex; align-items: center; gap: 10px; }
.cs-ch h2 span { font: 700 12px var(--mono); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.cs-l h3 { font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
.cs-l h3 a { color: var(--muted); text-decoration: none; }
.cs-l h3 a:hover { color: var(--accent); }
.cs-l dl { margin: 0; display: grid; gap: 4px; }
.cs-row { display: grid; grid-template-columns: minmax(96px, auto) minmax(0, 1fr); gap: 12px; align-items: baseline; font-size: 14px; }
.cs-row dt { min-width: 0; }
.cs-row dd { margin: 0; color: var(--muted); }
.cs-row kbd { white-space: normal; word-break: break-all; }

/* Schmale Bildschirme */
@media (max-width: 980px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: block; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; height: 100%; width: min(320px, 86vw); z-index: 50; background: var(--bg); transform: translateX(-102%); transition: transform .2s ease; padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); }
  .nav-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .3); }
  .nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .35); }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .pg-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .has-goal .pr-stage { grid-template-columns: minmax(0, 1fr); }
  .stats, .drill-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ed-screen { font-size: 13px; }
  .practice { padding: 14px; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .topbar { gap: 10px; }
  .brand span:last-child { display: none; }
  .cs-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
